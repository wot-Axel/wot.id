type EncryptedAsset @createModel(accountRelation: LIST, description: "Encrypted digital or real-world assets") {
  # Asset type
  assetType: String! @string(maxLength: 50) # "digital" or "real_world"
  
  # Core asset data (encrypted)
  encryptedData: String! @string(maxLength: 100000)
  encryptedKey: String! @string(maxLength: 10000)
  
  # Metadata
  addedDate: DateTime!
  lastVerified: DateTime
}
