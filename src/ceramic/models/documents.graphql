type EncryptedDocument @createModel(accountRelation: LIST, description: "Encrypted document references") {
  # Document information
  documentType: String! @string(maxLength: 50)
  documentName: String! @string(maxLength: 200)
  
  # Encrypted storage references
  ipfsCid: String! @string(maxLength: 100)
  encryptedSymmetricKey: String! @string(maxLength: 10000)
  accessControlConditions: String! @string(maxLength: 10000)
  
  # Metadata
  uploadDate: DateTime!
  expiryDate: DateTime
  verified: Boolean
  verificationDetails: String @string(maxLength: 5000)
}
