type EncryptedProfile @createModel(accountRelation: SINGLE, description: "Encrypted user profile information") {
  # Basic profile information (encrypted)
  encryptedData: String! @string(maxLength: 100000)
  encryptedKey: String! @string(maxLength: 10000)
  
  # Optional public reference fields
  displayName: String @string(maxLength: 100)
  avatarReference: String @string(maxLength: 200)
  
  # Metadata
  lastUpdated: DateTime! 
}
